[project]
name = "admin-api"
version = "0.1.0"
description = "SWARM Admin API: templates, runs, run_events, and POST /runs/enqueue over shared runtime Postgres and Redis."
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy[asyncio]",
  "asyncpg",
  "httpx",
  "redis>=5.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

