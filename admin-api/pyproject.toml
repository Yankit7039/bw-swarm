[project]
name = "admin-api"
version = "0.1.0"
description = "SWARM Admin API: read-only FastAPI service over runtime Postgres (templates, runs, run_events)."
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy[asyncio]",
  "asyncpg",
  "httpx",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

