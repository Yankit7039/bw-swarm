# Runtime service — template-agnostic API for runs. Runs in cluster to create SandboxClaims.
# Build from repo root: docker build -f runtime/Dockerfile -t swarm-runtime:latest .
# Load into kind: kind load docker-image swarm-runtime:latest
# Requires adk-secrets with key database-url (postgresql+asyncpg://...@host.docker.internal:5432/swarm).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runtime
  labels:
    app: runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: runtime
  template:
    metadata:
      labels:
        app: runtime
    spec:
      serviceAccountName: runtime
      containers:
        - name: runtime
          image: swarm-runtime:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: adk-secrets
                  key: database-url
            - name: JIRA_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: adk-secrets
                  key: jira-webhook-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: runtime
  labels:
    app: runtime
spec:
  type: NodePort
  selector:
    app: runtime
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
      name: http
