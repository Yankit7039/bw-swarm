apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: adk-secrets
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: adk-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: REPLACE_WITH_SECRET_NAME

