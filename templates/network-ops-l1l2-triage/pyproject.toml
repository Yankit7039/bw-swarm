[project]
name = "network-ops-l1l2-triage-adk"
version = "1.0.0"
description = "Network ops L1/L2 triage — hybrid YAML-driven workflow for runtime/sandbox"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk",
    "litellm>=1.75.5,<2.0.0",
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "pyyaml",
    "mcp",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["network_ops_l1l2_triage"]
