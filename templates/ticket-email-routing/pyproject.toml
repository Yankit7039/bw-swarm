[project]
name = "ticket-email-routing-adk"
version = "1.0.0"
description = "Ticket email routing — hybrid YAML-driven workflow for runtime/sandbox"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk",
    "litellm>=1.75.5,<2.0.0",
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "pyyaml",
    "mcp",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ticket_email_routing"]
