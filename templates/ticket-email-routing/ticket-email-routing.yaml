template_id: ticket-email-routing
version: "1.0"
description: Fetches ticket by order, resolves escalation contact, drafts email, sends via AgentMail.

input:
  required:
    - order_id

adapters:
  - jira
  - escalation_matrix
  - agentmail

stages:

  - name: classify
    type: deterministic
    skip_if: "is_followup or is_reply"
    steps:
      - name: fetch_ticket
        type: mcp_call
        tool: jira__get_ticket
        input:
          order_id: "{{ order_id }}"
        output_key: ticket_details
      - name: transition_ticket
        type: mcp_call
        tool: jira__transition_ticket
        input:
          order_id: "{{ order_id }}"
          target_status: "In Progress"
        output_key: transition_result
      - name: route_department
        type: llm_agent
        description: Choose escalation department from ticket context
        instruction: |
          You route internal escalations. Given the order id and ticket context below, pick exactly one department key for the escalation matrix.

          Allowed values for "department" (string, exactly one of):
          billing, porting, network_provisioning, field_ops

          Base your choice only on the ticket title, status, and description text (including description_plain if present). If unclear, choose the closest match.

          Order ID: {{ order_id }}
          Ticket context: {{ ticket_details }}

          Respond ONLY as JSON, no markdown, no extra text:
          {"department": "..."}
        output_key: routing
        fallback_state:
          department: ""

  - name: lookup
    type: deterministic
    skip_if: "is_followup or is_reply"
    steps:
      - name: lookup_contact
        type: mcp_call
        tool: escalation_matrix__lookup
        input:
          department: "{{ routing['department'] }}"
        output_key: contact

  - name: notify
    type: hybrid
    skip_if: "is_followup or is_reply"
    steps:
      - name: notify
        type: llm_agent
        description: Draft a concise escalation email from ticket context only
        instruction: |
          You are Swarm Agent. You are integrated with CRM/ticket data and routing rules: you have already classified where this order is stuck and selected the escalation recipient below from the matrix. Write an internal handoff email so that person can start work immediately—informative and direct, not a generic “please advise” request.

          Rules:
          - Use ONLY the facts in Order ID / Ticket context / Escalation recipient below. Do not invent ticket IDs, systems, customer names, or details not present.
          - Subject: specific (order id + issue in plain language), at most about 15 words.
          - Body: about 120–200 words (roughly 3–5 short paragraphs). Be clear and scannable; sound like a colleague handing off a case, not a template.
          - Opening: one short line addressing the escalation recipient by name/role (Escalation recipient).
          - In the first one or two sentences of the body, state the order id explicitly (the value from Order ID below, e.g. ORD-xxx). Add customer or product context only if it appears in the ticket context.
          - Describe what is blocked using blocked_reason / ticket fields; state customer impact only if present.
          - Give concrete next step(s) for this recipient (from next_action / ticket text). Use a short numbered list if several steps help.
          - One sentence on why they are the right person: frame as department or escalation ownership for this failure mode (e.g. billing proration, LNP reject). Do not say “queue,” “your queue,” or “owns this queue.”
          - Do not use: “queue,” “please advise,” “urgently,” “at your earliest convenience,” or similar filler unless that exact wording appears in the ticket data.
          - End the body with a blank line, then exactly:
            Thank you,
            Swarm Agent

          Order ID: {{ order_id }}
          Ticket context: {{ ticket_details }}
          Escalation recipient: {{ contact['name'] }}

          Respond ONLY as JSON, no markdown, no extra text:
          {"subject": "...", "body": "..."}
        input_keys: [order_id, ticket_details, contact]
        output_key: email_draft
        fallback_state:
          subject: "Escalation — order {{ order_id }} needs attention"
          body: |
            Order {{ order_id }}: we could not auto-draft the full message. Please open this order in the CRM, review the ticket summary and escalation match for {{ contact['name'] }}, and clear the blocker so the order can progress.

            Thank you,
            Swarm Agent

      - name: send_email
        type: mcp_call
        tool: agentmail__send_email
        input:
          to: "{{ contact['email'] }}"
          subject: "{{ email_draft['subject'] }}"
          body: "{{ email_draft['body'] }}"
        output_key: email_result

  - name: followup
    type: deterministic
    skip_if: "is_followup == False or is_reply"
    steps:
      - name: check_jira_status
        type: mcp_call
        tool: jira__get_ticket
        input:
          order_id: "{{ followup_context['order_id'] }}"
        output_key: current_ticket
      - name: evaluate_status
        type: condition
        branches:
          - if: "current_ticket['status_lower'] == 'resolved'"
            set:
              resolved: true
          - else: true
            set:
              resolved: false
      - name: draft_followup_email
        type: llm_agent
        skip_if: "resolved"
        description: Reply body only for follow-up in existing thread
        instruction: |
          You write a short follow-up reply body for an internal escalation email thread. Use only the facts below. Do not invent ticket IDs, systems, or customer details.

          Follow-up number (1 = polite reminder, 2 = firm and urgent, 3 = critical; 3 is the final follow-up): {{ followup_context['followup_attempt_number'] }}

          Order ID: {{ followup_context['order_id'] }}

          Tone:
          - If follow-up number is 1: polite reminder that you are still waiting on action.
          - If 2: firm and urgent.
          - If 3: critical; state clearly this is the final follow-up.

          Reference the order id in the body. Do not add new claims or next steps not implied by the context.

          Respond ONLY as JSON, no markdown, no extra text:
          {"body": "..."}
        output_key: followup_draft
        fallback_state:
          body: |
            Follow-up regarding order {{ followup_context['order_id'] }}: we are still waiting on progress. Please update the ticket or advise.

            Thank you,
            Swarm Agent
      - name: send_followup_reply
        type: mcp_call
        skip_if: "resolved"
        tool: agentmail__send_followup
        input:
          to: "{{ followup_context['contact_email'] }}"
          subject: "{{ followup_context['last_email_subject'] }}"
          body: "{{ followup_draft['body'] }}"
          thread_id: "{{ followup_context['thread_id'] }}"
          message_id: "{{ followup_context['message_id'] }}"
        output_key: reply_result

  - name: engineer_reply
    type: deterministic
    skip_if: "is_reply == False"
    steps:
      - name: fetch_ticket_reply
        type: mcp_call
        tool: jira__get_ticket
        input:
          order_id: "{{ order_id }}"
        output_key: ticket_details
      - name: draft_engineer_reply
        type: llm_agent
        tool_filter:
          - agentmail__send_followup
        description: Draft a short reply to the engineer in the existing thread
        instruction: |
          You respond in an internal escalation email thread. The engineer sent a message; reply helpfully and briefly using only facts from Order ID, their message, and the ticket context below. Do not invent ticket IDs, systems, or customer details.

          Order ID: {{ order_id }}

          Engineer's message:
          {{ reply_context['body'] }}

          Ticket context (Jira): {{ ticket_details }}

          Thread / escalation: order {{ followup_context['order_id'] }}, contact {{ followup_context['contact_email'] }}.

          Respond ONLY as JSON, no markdown, no extra text:
          {"body": "..."}
        output_key: engineer_reply_draft
        fallback_state:
          body: |
            Thanks for the update on order {{ order_id }}. We will proceed and follow up if anything else is needed.

            Thank you,
            Swarm Agent
      - name: send_engineer_reply
        type: mcp_call
        tool: agentmail__send_followup
        input:
          to: "{{ followup_context['contact_email'] }}"
          subject: "{{ followup_context['last_email_subject'] }}"
          body: "{{ engineer_reply_draft['body'] }}"
          thread_id: "{{ followup_context['thread_id'] }}"
          message_id: "{{ followup_context['message_id'] }}"
        output_key: engineer_reply_result
