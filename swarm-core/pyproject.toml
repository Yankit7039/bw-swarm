[project]
name = "swarm-core"
version = "1.0.0"
description = "Shared YAML-driven workflow runtime for SWARM template pods"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk",
    "litellm>=1.75.5,<2.0.0",
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "pyyaml",
    "mcp",
    "python-dotenv",
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swarm_core"]
