[project]
name = "swarm-adapter"
version = "0.1.0"
description = "SWARM Adapter Service: FastAPI + MCP integration layer (mock backends for now)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "mcp",
  "pydantic",
  "agentmail",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
